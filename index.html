<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 37th Monthsary, langga</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffb3cc;--ink:#5a1a33;--card:#fff;--accent:#e63e74;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1024;--bg2:#5c1a3a;--ink:#ffe3ec;--card:#2b0c1a;--accent:#ff6b9a}}
:root[data-theme="dark"]{--bg1:#3a1024;--bg2:#5c1a3a;--ink:#ffe3ec;--card:#2b0c1a;--accent:#ff6b9a}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#score{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;font-size:20px;z-index:2;pointer-events:none}
#meter{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:3;text-align:center;cursor:default}
#meter svg{width:58px;display:block;overflow:visible}
#meter .n{font-size:14px;margin-top:4px}
#meter.full{cursor:pointer;animation:beat .7s infinite}
#meter.pop{animation:pop .45s forwards}
@keyframes beat{50%{transform:translateY(-50%) scale(1.25)}}
@keyframes pop{60%{transform:translateY(-50%) scale(2.6);opacity:1}100%{transform:translateY(-50%) scale(3.4);opacity:0}}
#hint{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:20px;z-index:2;pointer-events:none;display:none}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,0,20,.55);z-index:5;padding:16px;box-sizing:border-box}
.overlay.show{display:flex}
#shout{position:fixed;left:12px;top:38%;max-width:45%;font-size:22px;font-weight:bold;color:var(--accent);z-index:3;pointer-events:none;opacity:0}
#shout.on{animation:shout 1.4s forwards}
@keyframes shout{0%{opacity:0;transform:translateY(10px) rotate(-6deg) scale(.8)}15%{opacity:1;transform:translateY(0) rotate(-6deg) scale(1.1)}70%{opacity:1;transform:rotate(-6deg)}100%{opacity:0;transform:translateY(-14px) rotate(-6deg)}}
.box{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.box p{line-height:1.5}
#greet{white-space:pre-line;font-size:19px;line-height:1.6}
#photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;margin-top:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:24px;padding:12px 26px;font-size:16px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">🏀 0</div>
<div id="meter"><svg viewBox="0 0 32 29"><defs><clipPath id="hc"><path id="hp" d="M16 28C16 28 2 18 2 9C2 4.5 5.5 2 9 2C12 2 14.5 3.5 16 6C17.5 3.5 20 2 23 2C26.5 2 30 4.5 30 9C30 18 16 28 16 28Z"/></clipPath></defs>
<rect x="0" y="0" width="32" height="29" fill="rgba(255,255,255,.55)" clip-path="url(#hc)"/>
<rect id="hf" x="0" y="29" width="32" height="0" fill="#e63e74" clip-path="url(#hc)"/>
<use href="#hp" fill="none" stroke="#e63e74" stroke-width="1.6"/></svg><div class="n" id="mn">0/37</div></div>
<div id="hint">Sa wakas! After pila ka oras HAHAHAHAHA 😭<br>Tap the heart, langga! 💗</div>
<div id="shout"></div>

<div class="overlay show" id="start"><div class="box">
<div style="font-size:56px">🏀</div>
<h2 style="font-weight:normal;margin:6px 0">Happy 37th Monthsary, langga!</h2>
<p>Swipe up on the ball to shoot.<br>Pun-a ang heart, 37 baskets lang!</p>
<button id="go">Play</button>
</div></div>

<div class="overlay" id="end"><div class="box">
<div id="greet"></div>
<div id="photo"></div>
<p style="margin:16px 0 0"><button id="again">Play again 💗</button></p>
</div></div>

<script>
var YOUR_NAME="Aldrian";
var PHOTO=null; // image data URI, optional
var GREETING="Happy 37th Monthsary, langga! 💗\n\nSalamat gid sa tanan.\nPalangga ta ka gid.\n\nAnd sorry gd kis-a kung kadungol man sakon.\nThank you gd baby sa imo patience man pirme sakon, bisan wala kaman pasensya hehe 💗\n\n— "+YOUR_NAME;
var TARGET=37,G=1900;
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
var W,H,hoopY,restY,rimW,R=30;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);hoopY=H*.26;restY=H-100;rimW=Math.min(130,W*.32);if(!ball.flying){ball.x=W/2;ball.y=restY}}
var ball={x:0,y:0,vx:0,vy:0,flying:false,scored:false,t:0},hx=0,dir=1,score=0,locked=false,playing=false,last=0,sw=null,net=0;
resize();addEventListener('resize',resize);hx=W/2;
function $(i){return document.getElementById(i)}

function setMeter(){var p=score/TARGET;$('hf').setAttribute('y',29*(1-p));$('hf').setAttribute('height',29*p);$('mn').textContent=score+'/'+TARGET;$('score').textContent='🏀 '+score}
function start(){$('start').classList.remove('show');$('end').classList.remove('show');score=0;locked=false;hx=W/2;dir=1;ball.flying=false;ball.x=W/2;ball.y=restY;$('meter').className='';$('hint').style.display='none';setMeter();if(!playing){playing=true;last=performance.now();requestAnimationFrame(loop)}}
$('go').onclick=start;$('again').onclick=start;
$('meter').onclick=function(){
  if(!locked||$('meter').className.indexOf('full')<0)return;
  $('meter').className='pop';$('hint').style.display='none';
  setTimeout(function(){$('greet').textContent=GREETING;$('photo').innerHTML=PHOTO?'<img alt="Us" src="'+PHOTO+'">':'';$('end').classList.add('show')},420);
};

cv.addEventListener('pointerdown',function(e){if(!ball.flying&&!locked&&playing)sw={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',function(e){
  if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y,dt=Math.max((performance.now()-sw.t)/1000,.05);sw=null;
  if(dy>-40)return;shoot(dx,dy,dt);
});
function shoot(dx,dy,dt){
  var sp=Math.hypot(dx,dy)/dt,f=Math.max(.97,Math.min(1.08,sp/1400));
  var h=ball.y-hoopY,vy0=Math.sqrt(2*G*(h+H*.1))*f;
  var T=(vy0+Math.sqrt(Math.max(vy0*vy0-2*G*h,0)))/G;
  var vxS=dx/Math.abs(dy)*vy0*.5,vxA=(hx-ball.x)/T;
  ball.vx=vxS*.4+vxA*.6;ball.vy=-vy0;ball.flying=true;ball.scored=false;ball.t=0;
}

var SHOUTS=["Ay nano!","Pigaw haw!","Nd amo haw!","Libat haw!","D balo haw!","D balo timing haw!","Hays kadugay..."],bag=[];
function miss(){
  if(!bag.length){bag=SHOUTS.slice();for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=bag[i];bag[i]=bag[j];bag[j]=t}}
  var s=$('shout');s.textContent=bag.pop();s.classList.remove('on');void s.offsetWidth;s.classList.add('on');
}
function loop(t){
  var dt=Math.min((t-last)/1000,.05);last=t;
  var sp=Math.min(60+score*12,480);
  hx+=dir*sp*dt;var lo=rimW/2+16,hi=W-rimW/2-16-70;
  if(hx>hi){hx=hi;dir=-1}if(hx<lo){hx=lo;dir=1}
  if(ball.flying){
    var py=ball.y;ball.t+=dt;ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(!ball.scored&&ball.vy>0&&py<hoopY&&ball.y>=hoopY&&Math.abs(ball.x-hx)<rimW/2-8){
      ball.scored=true;ball.vx*=.2;net=1;score++;setMeter();
      if(score>=TARGET){locked=true;$('meter').className='full';$('hint').style.display='block'}
    }
    if(ball.y>H+60||ball.t>3){if(!ball.scored)miss();ball.flying=false;ball.x=W/2;ball.y=restY}
  }
  net=Math.max(0,net-dt*3);
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var bw=rimW+60,bt=hoopY-rimW*.62;
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.strokeStyle='#e63e74';ctx.lineWidth=4;
  ctx.fillRect(hx-bw/2,bt,bw,rimW*.62);ctx.strokeRect(hx-bw/2,bt,bw,rimW*.62);
  var s=ball.flying?Math.max(.55,Math.min(1,1-.4*((restY-ball.y)/(restY-hoopY)))):1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(R*2*s)+'px serif';ctx.fillText('🏀',ball.x,ball.y);
  ctx.strokeStyle='#ff5a1f';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hx-rimW/2,hoopY);ctx.lineTo(hx+rimW/2,hoopY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;var d=28+net*10;
  for(var i=0;i<=5;i++){var x=hx-rimW/2+rimW*i/5,x2=hx-rimW/3+rimW*2/3*i/5;ctx.beginPath();ctx.moveTo(x,hoopY);ctx.lineTo(x2,hoopY+d);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(hx-rimW/3,hoopY+d);ctx.lineTo(hx+rimW/3,hoopY+d);ctx.stroke();
}
</script>
</body>
</html>
